name: Build Windows installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q --tb=line -p no:cacheprovider > out.txt 2>&1 || { echo "::error::$(grep -E 'Error|FAILED|assert|failed|passed' out.txt | head -12 | tr '\n' '|')"; exit 1; }
      - run: pyinstaller --noconfirm eyecare.spec
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import eyecare; print(eyecare.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\eyecare.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Setup
          path: dist-installer/EyeCare-Setup.exe
      - name: Write release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py ${{ steps.ver.outputs.version }} release-notes.md
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/EyeCare-Setup.exe
          body_path: release-notes.md
