name: Build Windows exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q --tb=line -p no:cacheprovider > out.txt 2>&1 || { echo "::error::$(grep -E 'Error|FAILED|assert|failed|passed' out.txt | head -12 | tr '\n' '|')"; exit 1; }
      - run: pyinstaller --noconfirm eyecare.spec
      - uses: actions/upload-artifact@v4
        with:
          name: EyeCare-windows
          path: dist/EyeCare.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EyeCare.exe
