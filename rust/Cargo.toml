[package]
name = "eyecare"
version = "0.4.0"
edition = "2021"
description = "Eye Care - a quiet Windows companion that protects your eyes (Rust rewrite)."
license = "MIT"
rust-version = "1.80"

[lib]
name = "eyecare"
path = "src/lib.rs"

[[bin]]
name = "eyecare"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
